<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#FFD35C">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>小鸭上学记</title>
<style>
/* ============================================================
   小鸭上学记 · style.css
   分区：① 变量 ② 基础布局 ③ canvas 舞台 ④ DOM 覆盖层/面板
        ⑤ 开关/统计 ⑥ HUD ⑦ 竖屏 ⑧ 无障碍
   ⚠️ safe-area 变量必须在 :root 里**真的定义**，只写 env() 不定义变量
      会一直是 0（本仓库已在 chick-fan 踩过这个坑）。
   ============================================================ */

/* ---------- ① 变量：小鸡 DNA 8 色 + 小鸭色 + 场景派生色 ---------- */
:root{
  /* 小鸡 DNA 8 色（硬约束：禁止新增色系） */
  --bg:        #FFFBEC;
  --bg-soft:   #FFF6E0;
  --chick:     #FFD35C;   /* 主黄：只给 UI（按钮/进度条/星星） */
  --chick-br:  #F7C948;   /* 深黄 */
  --beak:      #FF9A3C;   /* 橙 */
  --comb:      #E4453A;   /* 红 */
  --ink:       #4A3722;   /* 深棕 */
  --ink-soft:  #8A7250;   /* 浅棕 */

  /* 小鸭主角 */
  --duck-body: #FFE9A8;
  --duck-line: #F7C948;

  /* 场景派生（同色系延展） */
  --sky-out-a: #DFF0FA;   /* 第5关去程 晨光偏冷 */
  --sky-out-b: #FFF3D0;
  --sky-in-a:  #FFE9B8;   /* 第5关回程 午后偏暖 */
  --sky-in-b:  #FFCF8A;
  --warm-veil: rgba(255,180,90,.12);
  --shadow:    rgba(74,55,34,.16);
  --line-w:    3px;

  /* 圆角三档 / 缓动 / 时长：全站唯一来源 */
  --r-sm:14px; --r-md:18px; --r-lg:22px;
  --ease: cubic-bezier(.22,.61,.36,1);
  --dur: .22s;
  --dur-fast: .18s;
  --dur-slow: .26s;

  /* iOS 安全区：四个方向都真的定义，缺一个方向就会算成 0 */
  --sat: env(safe-area-inset-top, 0px);
  --sar: env(safe-area-inset-right, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px);

  --font: "PingFang SC","Microsoft YaHei","Hiragino Sans GB",-apple-system,
          BlinkMacSystemFont,"Segoe UI",sans-serif;
}

/* ---------- ② 基础 ---------- */
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; padding:0; width:100%; height:100%; overflow:hidden; }
body{
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  min-height:100vh;
  min-height:100dvh;              /* iOS Safari：dvh 才是可视高度 */
  touch-action:none;              /* 禁掉双击缩放 / 橡皮筋滚动 */
  user-select:none;
  -webkit-user-select:none;
}
button{ font-family:var(--font); touch-action:manipulation; }

/* ---------- ③ 舞台：固定 960×640（竖屏 960×900），transform 等比缩放 ---------- */
#stage{
  position:fixed; left:0; top:0; right:0; bottom:0;
  display:flex; align-items:center; justify-content:center;
  background: radial-gradient(circle at 30% 20%, #FFF6E0 0, var(--bg) 70%);
  overflow:hidden;
}
#app{
  position:relative;
  width:960px; height:640px;
  transform-origin:0 0;
  border-radius:var(--r-lg);
  overflow:hidden;
  box-shadow: 0 10px 34px rgba(74,55,34,.18);
  background: var(--sky-out-b);
}
#cv{ display:block; width:100%; height:100%; touch-action:none; }

/* ---------- ④ DOM 覆盖层：分层 pointer-events，面板隐藏=完全不响应 ---------- */
#ui{ position:absolute; inset:0; pointer-events:none; }
#ui > .screen{
  position:absolute; inset:0;
  display:none; flex-direction:column; align-items:center; justify-content:center;
  padding: calc(18px + var(--sat)) calc(18px + var(--sar)) calc(18px + var(--sab)) calc(18px + var(--sal));
  pointer-events:auto;
  background: rgba(255,251,236,.92);
}
#ui > .screen.show{ display:flex; }
#ui > .screen.screen-tip{ background: rgba(255,251,236,.97); }

.card-panel{
  width:min(560px, 92%);
  max-height:100%;
  overflow-y:auto;
  background: var(--bg-soft);
  border: var(--line-w) solid rgba(74,55,34,.14);
  border-radius: var(--r-lg);
  padding: 22px 24px 20px;
  box-shadow: 0 8px 22px var(--shadow);
  text-align:center;
}
.logo-duck{ font-size:56px; line-height:1; margin-bottom:6px; user-select:none; }
.ttl{ font-size:30px; margin:0 0 4px; color:var(--comb); letter-spacing:.04em; }
.sub{ font-size:15px; margin:0 0 14px; color:var(--ink-soft); line-height:1.7; }

.btn-col{ display:flex; flex-direction:column; gap:10px; }
.btn-row{ display:flex; gap:10px; justify-content:center; margin-top:14px; }
.btn{
  min-height:52px; min-width:132px;
  padding: 12px 22px;
  font-size:17px; font-weight:700;
  color:var(--ink);
  background:#fff;
  border:var(--line-w) solid rgba(74,55,34,.16);
  border-radius: var(--r-md);
  box-shadow: 0 3px 0 rgba(74,55,34,.16);
  transition: transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease),
              background var(--dur) var(--ease);
  cursor:pointer;
}
.btn:active{ transform:translateY(3px); box-shadow:none; }
.btn-primary{ background:var(--chick); border-color:var(--chick-br); color:var(--ink); }
.btn-ghost{ background:transparent; box-shadow:none; border-color:rgba(74,55,34,.12); color:var(--ink-soft); }
.btn[disabled]{ opacity:.45; box-shadow:none; cursor:default; }

/* 关卡卡片 */
.level-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(132px,1fr)); gap:10px; }
.level-cell{
  position:relative;
  min-height:96px; padding:10px 8px;
  border-radius: var(--r-md);
  background:#fff;
  border: var(--line-w) solid rgba(74,55,34,.14);
  box-shadow: 0 3px 0 rgba(74,55,34,.14);
  cursor:pointer;
  transition: transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
}
.level-cell:active{ transform:translateY(3px); box-shadow:none; }
.level-cell .lv-no{ font-size:22px; font-weight:800; color:var(--comb); }
.level-cell .lv-name{ font-size:13px; color:var(--ink-soft); margin-top:3px; line-height:1.4; }
.level-cell .lv-stars{ margin-top:5px; font-size:15px; letter-spacing:2px; color:var(--chick-br); }
.level-cell .lv-stars .off{ opacity:.26; }
.level-cell.locked{ opacity:.5; cursor:default; }
.level-cell.round{ border-color:var(--beak); box-shadow:0 3px 0 var(--beak); }
.level-cell .lv-ck{
  position:absolute; top:4px; right:6px;
  font-size:10px; color:#fff; background:var(--beak);
  padding:2px 6px; border-radius:var(--r-sm);
}

/* 图鉴 */
.gallery-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
.gal-cell{
  border-radius:var(--r-md); background:#fff;
  border:var(--line-w) solid rgba(74,55,34,.12);
  padding:8px 4px 6px; text-align:center;
}
.gal-cell .gal-ic{ font-size:30px; line-height:1.1; }
.gal-cell .gal-nm{ font-size:12px; color:var(--ink-soft); margin-top:2px; }
.gal-cell.off .gal-ic{ filter:grayscale(1) opacity(.3); }
.gal-cell.off .gal-nm{ opacity:.5; }

/* ---------- ⑤ 开关 + 家长统计 ---------- */
.switch-row{
  display:flex; align-items:center; justify-content:space-between;
  padding:10px 4px; border-bottom:1px dashed rgba(74,55,34,.16);
}
.switch-label{ font-size:16px; font-weight:600; }
.switch{
  width:64px; height:36px; min-height:36px; padding:0;
  border:none; border-radius:999px; background:rgba(74,55,34,.2);
  position:relative; cursor:pointer;
  transition: background var(--dur) var(--ease);
}
.switch i{
  position:absolute; top:3px; left:3px;
  width:30px; height:30px; border-radius:50%;
  background:#fff; box-shadow:0 2px 5px var(--shadow);
  transition: translate var(--dur) var(--ease);
}
.switch[aria-checked="true"]{ background:var(--chick); }
.switch[aria-checked="true"] i{ translate:28px 0; }

.stats-box{
  margin:14px 0 12px; padding:12px 14px;
  background:#fff; border-radius: var(--r-md);
  border:1px dashed rgba(74,55,34,.2);
  text-align:left; font-size:13.5px; color:var(--ink-soft);
  max-height:210px; overflow-y:auto;
}
.stats-box h3{ margin:0 0 8px; font-size:15px; color:var(--ink); }
.stats-box .srow{ display:flex; justify-content:space-between; padding:3px 0; }
.stats-box .srow b{ color:var(--ink); font-variant-numeric:tabular-nums; }

/* 结算 */
.stars{ display:flex; gap:10px; justify-content:center; margin:10px 0 14px; }
.stars i{
  width:38px; height:38px; display:block;
  background: rgba(74,55,34,.14);
  clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
  transition: background var(--dur-slow) var(--ease);
}
.stars i.on{ background:var(--chick); }
.res-rows{ text-align:left; margin-bottom:8px; }
.res-rows .rrow{
  display:flex; justify-content:space-between;
  padding:8px 6px; font-size:15px;
  border-bottom:1px dashed rgba(74,55,34,.14);
}
.res-rows .rrow b{ font-variant-numeric:tabular-nums; }

/* Toast */
#toast{
  position:absolute; left:50%; bottom: calc(64px + var(--sab));
  translate:-50% 0;
  background:rgba(74,55,34,.92); color:#fff;
  font-size:14px; padding:10px 18px; border-radius:var(--r-md);
  opacity:0; transition:opacity var(--dur) var(--ease);
  pointer-events:none; white-space:nowrap; z-index:9;
}
#toast.show{ opacity:1; }

/* ---------- ⑥ canvas 内 HUD 相关的 DOM 辅助（实际 HUD 在 canvas 里画） ---------- */
#ui.passthrough > .screen{ background:transparent; }
#ui.passthrough > .screen.screen-tip,
#ui.passthrough > .screen#screen-title,
#ui.passthrough > .screen#screen-result{ background: rgba(255,251,236,.92); }

/* ---------- ⑦ 竖屏：视野 960×900，上下分屏，上 38% / 下 62% ---------- */
body.portrait #app{ width:960px; height:900px; }
body.portrait .card-panel{ width:min(600px,96%); }

/* ---------- ⑧ 无障碍 ---------- */
@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.08s !important;
  }
}

</style>
</head>
<body>
<div id="stage">
  <div id="app">
    <canvas id="cv" width="960" height="640"></canvas>

    <!-- ============ DOM 覆盖层：全部面板结构在此，样式在 style.css ============ -->
    <div id="ui">

      <!-- —— 标题页 —— -->
      <section class="screen" id="screen-title">
        <div class="card-panel">
          <div class="logo-duck" aria-hidden="true">🐤</div>
          <h1 class="ttl">小鸭上学记</h1>
          <p class="sub">睡觉 · 起床 · 上学 · 和大家一起回家</p>
          <div class="btn-col">
            <button class="btn btn-primary" id="btn-start">开始上学</button>
            <button class="btn" id="btn-levels">选关卡</button>
            <button class="btn" id="btn-gallery">同学图鉴</button>
            <button class="btn" id="btn-settings">设置</button>
          </div>
        </div>
      </section>

      <!-- —— 关卡选择 —— -->
      <section class="screen" id="screen-levels">
        <div class="card-panel">
          <h2 class="ttl">选一关</h2>
          <div class="level-grid" id="level-grid"><!-- JS 填充 --></div>
          <div class="btn-row">
            <button class="btn" id="btn-lv-back">返回</button>
          </div>
        </div>
      </section>

      <!-- —— 第 5 关「从头跑 / 继续回程」询问 —— -->
      <section class="screen" id="screen-l5ask">
        <div class="card-panel">
          <h2 class="ttl">第 5 关</h2>
          <p class="sub">上次跑到学校门口啦，要继续跑回家吗？</p>
          <div class="btn-col">
            <button class="btn btn-primary" id="btn-l5-fresh">从头跑（推荐）</button>
            <button class="btn" id="btn-l5-resume">继续回程</button>
            <button class="btn btn-ghost" id="btn-l5-cancel">先不玩</button>
          </div>
        </div>
      </section>

      <!-- —— 图鉴（8 位） —— -->
      <section class="screen" id="screen-gallery">
        <div class="card-panel">
          <h2 class="ttl">同学图鉴</h2>
          <div class="gallery-grid" id="gallery-grid"><!-- JS 填充 --></div>
          <div class="btn-row">
            <button class="btn" id="btn-gl-back">返回</button>
          </div>
        </div>
      </section>

      <!-- —— 设置 —— -->
      <section class="screen" id="screen-settings">
        <div class="card-panel">
          <h2 class="ttl">设置</h2>
          <div class="switch-row">
            <span class="switch-label">🎵 音乐</span>
            <button class="switch" id="btn-music" role="switch" aria-checked="true"><i></i></button>
          </div>
          <div class="switch-row">
            <span class="switch-label">🔔 音效</span>
            <button class="switch" id="btn-sfx" role="switch" aria-checked="true"><i></i></button>
          </div>
          <div class="stats-box" id="stats-box"><!-- 家长统计 --></div>
          <div class="btn-col">
            <button class="btn" id="btn-copy-stats">复制统计数据（JSON）</button>
            <button class="btn btn-ghost" id="btn-reset-save">清空存档</button>
            <button class="btn" id="btn-set-back">返回</button>
          </div>
        </div>
      </section>

      <!-- —— 暂停 —— -->
      <section class="screen" id="screen-pause">
        <div class="card-panel">
          <h2 class="ttl">休息一下</h2>
          <div class="btn-col">
            <button class="btn btn-primary" id="btn-resume">继续玩</button>
            <button class="btn" id="btn-retry">重玩本关</button>
            <button class="btn btn-ghost" id="btn-quit">回主页</button>
          </div>
        </div>
      </section>

      <!-- —— 结算 —— -->
      <section class="screen" id="screen-result">
        <div class="card-panel">
          <h2 class="ttl" id="res-ttl">过关啦！</h2>
          <div class="stars" id="res-stars"><i></i><i></i><i></i></div>
          <div class="res-rows" id="res-rows"><!-- 用时/碰撞/相遇 --></div>
          <p class="sub" id="res-extra"></p>
          <div class="btn-col">
            <button class="btn btn-primary" id="btn-next">下一关</button>
            <button class="btn" id="btn-again">再跑一次</button>
            <button class="btn btn-ghost" id="btn-home">回主页</button>
          </div>
        </div>
      </section>

      <!-- —— 竖屏旋转引导（首次） —— -->
      <section class="screen screen-tip" id="screen-rot">
        <div class="card-panel">
          <div class="logo-duck" aria-hidden="true">📱</div>
          <p class="sub">横过来更好玩</p>
          <div class="btn-row">
            <button class="btn" id="btn-rot-close">×</button>
          </div>
        </div>
      </section>

      <!-- —— 通用提示条（复制成功等） —— -->
      <div id="toast"></div>
    </div>
  </div>
</div>
<script>
/* ==== src/js/00-const.js ==== */
/* ===== src/js/00-const.js · 常量与设计 token 的 JS 侧镜像 · 无依赖 ===== */
(function (global) {
  'use strict';

  /* ============================================================
   * AUTO_RUN_FROM_LEVEL —— 手势难度开关（PRD §6.1 Q3 决策预留）
   * ============================================================
   * 含义：从第 N 关起，小鸭自动向前跑，玩家只需「点击 = 跳跃」。
   * 现状：设为 2，即「第 1 关用『按住跑 + 点击跳』做教学，第 2 关起可切成
   *       『默认自动跑 + 点击跳』的单手势模式」。
   * 为什么预留：5–6 岁孩子能否学会「按住跑」尚未真人验证。若盲测（验收 B4）
   *       显示学不会，把这个值改成 1（或在第 2 关开场自动切换）即可，
   *       无需改动任何其他逻辑。
   * 实现要求（本文件下方 autoRunActive() 是**唯一读取点**）：
   *       ① 该常量被实际读取于关卡初始化逻辑，不是死代码；
   *       ② 切换后「按住」手势降级为加速（1.15×）而非唯一前进方式；
   *       ③ 第 1 关无论如何都保持双手势（教学关必须教会「按住」）。
   * 验收 A16 的判定方式：改本常量 → 重建 → 第 2 关起自动前进、第 1 关仍双手势。
   * ============================================================ */
  var AUTO_RUN_FROM_LEVEL = 2;

  var DUCK = {
    /* ---- 逻辑分辨率 ---- */
    DESIGN_W: 960,
    DESIGN_H: 640,
    DESIGN_H_PORTRAIT: 900,      /* 竖屏视野更高 = 看得更远，不是拉窄 */

    /* ---- 网格 / 物理（PRD §6.2，全部帧率无关：v += a*dt; p += v*dt）---- */
    GRID: 64,
    GRAVITY: 2200,
    V0_TAP: -880,                 /* 峰高 ≈ 176px */
    V0_HOLD: -980,                /* 峰高 ≈ 218px，holdMs ≥ 180 触发 */
    HOLD_MS_THRESHOLD: 180,
    CRUISE: 265,
    CRUISE_INBOUND: 280,          /* 第 5 关回程（轻快归家） */
    BOOST_MUL: 1.35,
    BOOST_SPEED: 360,
    MAX_VY: 1400,
    ACCEL_TIME: 0.35,
    DECEL_TIME: 0.25,
    AUTO_RUN_ACCEL: 1.15,         /* AUTO_RUN 模式下「按住」= 1.15× 加速 */

    /* ---- 碰撞盒：比视觉小 20%，宽容判定（PRD §6.2）---- */
    BOX_W: 44,
    BOX_H: 52,

    /* ---- 固定步长物理 ---- */
    FIXED_DT: 1 / 120,
    MAX_STEPS: 6,

    /* ---- 相遇触发距离 1.5 格 ---- */
    MEET_DIST: 96,
    FOLLOW_OFFSET: 60,            /* 队伍侧后方 60px */

    /* ---- 水洼腾空豁免 ----
     * puddle 是 fall:true / solid:false / h:0 的「踩空即落水」判定块，本身没有高度可供站立。
     * 若只看水平位置 d.s 落在水洼范围内就判落水，那么跳到峰顶（离地 176px）也会被判落水 ——
     * 水洼就永远跳不过去，第 3 关直接无解。故：脚底离地 ≥ PUDDLE_CLEAR 视为腾空越过。
     * 24px = 小鸭脚离地一个小台阶的高度，起跳后第 2~3 个物理帧即可达到，手感上是「跳起来就过」。 */
    PUDDLE_CLEAR: 24,

    /* ---- 碰撞演出 ---- */
    HIT_TOTAL: 0.90,              /* 三段演出总时长，PRD §5.3 */
    HIT_STAGE1: 0.15,
    HIT_STAGE2: 0.55,
    BUMP_VX: 180,
    BUMP_VY: -420,
    BUMP_BACK: 40,                /* 复位到障碍前 40px（§5.3 ④） */

    /* ---- 卡关兜底 ---- */
    STUCK_SEC: 6,                 /* 同位置 6s 无前进 */
    ASSIST_SEC: 1.5,              /* 自动前进 1.5s */

    /* ---- 幕一 ---- */
    ACT1_TOTAL: 25.0,
    ACT1_FADE_MIN: 3.2,           /* 渐弱底线，不可压缩 */
    ACT1_SKIP_FADE: 300,          /* 跳过时呼噜 0.3s 淡出 */
    BREATH_PERIOD: 2.8,

    /* ---- 幕二 ---- */
    ACT2_TOTAL: 30.0,

    /* ---- 第 5 关 ---- */
    L5_GATE_TOLERANCE: 24,        /* T1/T3 的终点容差：一帧跨过不漏触发 */
    MID_EVENT_MS: 1200,
    TURN_MS: 500,                 /* 全体转身 180° */
    VICTORY_MS: 2500,             /* CLEAR → finale 前的胜利演出 */

    /* ---- 存档 ---- */
    SAVE_KEY: 'chick-duck-school:save:v1',
    SAVE_VERSION: 1,

    /* ---- 音频 ---- */
    MASTER: 0.5, SFX_BUS: 0.9, MUSIC_BUS: 0.9, SNORE_BUS: 0.9,
    SFX_THROTTLE_MS: 60,          /* 同名音效 60ms 内重复忽略 */
    MAX_VOICE: 3,                 /* ★ 同时发声的**音效**节点 ≤ 3（架构 §5.4 ②） */
    MUSIC_VOICE: 6,               /* BGM 预排音符独立配额：音乐节点必须另算，
                                     否则「同时发声≤3」会把前瞻排好的下一个音符 stop 掉，BGM 直接断 */

(function (global) {
  'use strict';

  var K = global.DUCK.SAVE_KEY;
  var VER = global.DUCK.SAVE_VERSION;

  /* ---------- 默认存档（唯一来源） ---------- */
  function defaultSave() {
    return {
      version: VER,
      progress: {
        unlocked: 1,
        cleared: {},                 /* {"1": {stars,timeMs,bumps,met}} */
        l5Checkpoint: null           /* null | {phase:'mid'|'inbound', segTimeMs, bumps, met} */
      },
      gallery: {
        sheep: false, cat: false, dog: false, pig: false,
        rabbit: false, goose: false, qiaoqiao: false, kelin: false
      },
      hygiene: { potty: false, wash: false, wipe: false, bag: false },
      settings: { music: true, sfx: true, rotTipShown: false },
      stats: {
        totalRuns: 0, totalBumps: 0,
        firstPlayAt: null, lastPlayAt: null,
        l5out: 0, l5back: 0, inboundStuck: 0, act1Skip: 0,
        stuckCount: 0, autoRun: 0,
        orientation: 'unknown'

  function isPlainObject(v) {
    return v !== null && typeof v === 'object' && !Array.isArray(v);
  }

  function num(src, def, lo, hi) {
    if (typeof src !== 'number' || !isFinite(src)) return def;
    var v = src;
    if (lo !== undefined && v < lo) v = lo;
    if (hi !== undefined && v > hi) v = hi;
    return v;
  }

  function sanitizeCleared(src, def) {
    var out = {};
    if (!isPlainObject(src)) return out;
    for (var k in src) {
      if (!Object.prototype.hasOwnProperty.call(src, k)) continue;
      if (!/^[1-5]$/.test(k)) continue;                    /* 只有 1..5 关 */
      var v = src[k];
      if (!isPlainObject(v)) continue;
      var met = [];
      if (Array.isArray(v.met)) {
        for (var i = 0; i < v.met.length; i++) {
          var id = v.met[i];
          if (typeof id === 'string' && FRIENDS.indexOf(id) >= 0) met.push(id);
        }
      }
      out[k] = {
        stars: num(v.stars, 0, CLEARED_CLAMP.stars[0], CLEARED_CLAMP.stars[1]),
        timeMs: num(v.timeMs, 0, CLEARED_CLAMP.timeMs[0], CLEARED_CLAMP.timeMs[1]),
        bumps: num(v.bumps, 0, CLEARED_CLAMP.bumps[0], CLEARED_CLAMP.bumps[1]),
        met: met
      };
    }
    return out;
  }

  function sanitizeCheckpoint(v) {
    if (!isPlainObject(v)) return null;
    if (v.phase !== 'mid' && v.phase !== 'inbound') return null;   /* D5：只有两态 */
    if (typeof v.segTimeMs !== 'number' || !isFinite(v.segTimeMs) || v.segTimeMs < 0) return null;
    var met = [];
    if (Array.isArray(v.met)) {
      for (var i = 0; i < v.met.length; i++) {
        if (typeof v.met[i] === 'string' && FRIENDS.indexOf(v.met[i]) >= 0) met.push(v.met[i]);
      }
    }
    return {
      phase: v.phase,
      segTimeMs: v.segTimeMs,
      bumps: num(v.bumps, 0, 0, CLEARED_CLAMP.bumps[1]),
      met: met

  }

  /**
   * 深合并 sanitize。
   * 规则：src 有而 def 没有的键一律丢弃（防旧版/恶意数据渗入）。

  function sanitize(src, def) {
    if (!isPlainObject(def)) return def;
    if (!isPlainObject(src)) return def;

      var d = def[k], s = src[k];

      if (isPlainObject(d)) {
        /* 特殊结构 */
        if (k === 'cleared') { out[k] = sanitizeCleared(s, d); continue; }
        if (k === 'l5Checkpoint') { out[k] = sanitizeCheckpoint(s); continue; }
        out[k] = sanitize(s, d);

      if (d === null) { out[k] = (s === null) ? null : def[k]; continue; }
      if (typeof d === 'number') { out[k] = num(s, d, fieldClamp(k)[0], fieldClamp(k)[1]); continue; }

      case 'bumps': return [0, 9999];

  /** 就地替换内容但**保持对象身份**（Save.data 是活引用，整体换对象会让所有调用方读到孤儿对象） */
  function replaceAll(target, src) {
    for (var k in target) {
      if (Object.prototype.hasOwnProperty.call(target, k)) delete target[k];
    }
    for (var j in src) {

    var parsed = null;
    try { parsed = JSON.parse(raw); }                      /* 第 2 层：JSON 损坏 */
    catch (e) { return replaceAll(data, DEF); }

    if (parsed === null || typeof parsed !== 'object' || Array.isArray(parsed)) {
      return replaceAll(data, DEF);                        /* 第 3 层：类型错 */
    }
    /* 版本超前：整体重置（宁可重置也不乱读） */
    if (typeof parsed.version === 'number' && parsed.version > VER) {

    }

    /* 第 4 层：逐字段类型校验 + 深合并 */

  }

    st[name] = Math.round(v);
  }

  function now() {
    try { return new Date().toISOString(); } catch (e) { return null; }
  }

  function markRun() {
    if (!data.stats.firstPlayAt) data.stats.firstPlayAt = now();
    data.stats.lastPlayAt = now();
    bumpStat('totalRuns', 1);
  }

  /** 读取原始字符串（QA 钩子用；存储不可用返回 null） */
  function saveRaw() {
    try { return global.localStorage.getItem(K); } catch (e) { return null; }

      else if (kind === 'array') global.localStorage.setItem(K, '[]');
      else if (kind === 'null') global.localStorage.setItem(K, 'null');
      else if (kind === 'future') global.localStorage.setItem(K, '{"version":999}');
      else if (kind === 'met') global.localStorage.setItem(K, JSON.stringify({

      }));

  }

    flush: flush,

/* ===== src/js/50-physics.js · 定步长积分 / AABB / 支撑面 / 弹开 · 依赖 00-const =====
 * ⚠️ 本文件是**方向无关**的纯函数集：重力恒 +y，supportY() 与 direction 无关。
 *    去程与回程共用同一份代码（D9 决策的最大收益：R4 的方向 bug 风险自动消失）。
 *
 * ⚠️ 铁律：积分必须显式乘 dt —— `v += a*dt; p += v*dt`。
 *    写成 per-frame 增量 `p += v` 会让 120Hz iPad 上跳跃高度翻倍（最难查的一类 bug）。
 */
(function (global) {
  'use strict';

  var K = global.DUCK;

  /** 线性趋近（帧率无关）：按 rate*dt 逼近 target */
  function approach(cur, target, rate, dt) {
    var d = target - cur;
    var step = rate * dt;
    if (Math.abs(d) <= step) return target;
    return cur + (d > 0 ? step : -step);
  }

  /**
   * 求 s 处的支撑面 y（脚底 y）。
   * 规则：① 普通路面 = terrain 的 y；② lotus（荷叶）只在自身宽度内提供支撑；
   *      ③ 其余障碍（step/high/pumpkin...）顶部也可踩。
   * 传入 footY 是为了判断「从上方落下」还是「从下方经过」。
   */
  function supportY(seg, s, footY) {
    var base = seg.groundY;
    var best = base;
    var i, o, half, left, right;

    /* 荷叶/水洼这类落点平台：站在上面算支撑，掉下去 fall 判定交给 Game */
    for (i = 0; i < seg.obstacles.length; i++) {
      o = seg.obstacles[i];
      if (o.type !== 'lotus') continue;
      half = o.w / 2;
      if (s >= o.s - half && s <= o.s + half) {
        var top = base - 12;                 /* 荷叶顶面比路面高一点点，形成「跳上荷叶」 */
        if (footY <= top + 24) { best = top; break; }
      }
    }
    /* 高台 / 台阶顶面：踩上去 */
    for (i = 0; i < seg.obstacles.length; i++) {
      o = seg.obstacles[i];
      if (o.type !== 'step' && o.type !== 'high') continue;
      half = o.w / 2;
      left = o.s - half; right = o.s + half;
      if (s >= left && s <= right) {
        var otop = base - o.h;
        if (footY <= otop + 20) { best = Math.min(best, otop); break; }
      }
    }
    return best;
  }

  /** AABB 重叠（矩形 {x,y,w,h}，x/y 为左上角） */
  function aabb(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  /** 主角碰撞盒（比视觉小 20%，宽容判定）。s→x 由调用方按方向映射 */
  function duckBox(cx, footY) {
    return { x: cx - K.BOX_W / 2, y: footY - K.BOX_H, w: K.BOX_W, h: K.BOX_H };
  }

  /** 障碍碰撞盒（obstacle 的 s 是中心，y 是地面线） */
  function obsBox(o, groundY) {
    var h = o.h || 0;
    if (o.type === 'lotus' || o.type === 'puddle') {
      return { x: o.s - o.w / 2, y: groundY - 20, w: o.w, h: 20 };
    }
    return { x: o.s - o.w / 2, y: groundY - h, w: o.w, h: h };
  }

  /**
   * 固定步长积分。duck.s 是**进度坐标**（永远从左到右递增），
   * dir 只影响它映射到屏幕的位置，不影响物理。
   */
  function step(duck, seg, dt, input) {
    input = input || {};
    var cruise = seg.cruise || K.CRUISE;
    var autoRun = !!input.autoRun;
    var holding = !!input.holding;
    var target = 0;

    if (autoRun) {
      /* AUTO_RUN 模式：默认自动跑；按住 = 1.15× 加速（PRD §6.1 ②） */
      target = cruise * (holding ? K.AUTO_RUN_ACCEL : 1.0);
    } else {
      target = holding ? cruise : 0;
    }
    /* 冲刺带：boost.s0..s1 之间 ×1.35 */
    if (seg.boost && duck.s >= seg.boost.s0 && duck.s <= seg.boost.s1) {
      target = Math.max(target, cruise * seg.boost.mul);
    }

    var rate = (target > duck.vx ? cruise / K.ACCEL_TIME : cruise / K.DECEL_TIME);
    if (seg.boost && duck.s >= seg.boost.s0 && duck.s <= seg.boost.s1) rate *= seg.boost.mul;
    duck.vx = approach(duck.vx, target, rate, dt);

      var rad = (i % 2 === 0 ? r : r * 0.45), a = -Math.PI / 2 + i * Math.PI / 5;
      c2[i ? 'lineTo' : 'moveTo'](x + Math.cos(a) * rad, y + Math.sin(a) * rad);
    }
    c2.closePath(); c2.fillStyle = col; c2.fill();
    if (lineCol) { c2.lineWidth = 1.6; c2.strokeStyle = lineCol; c2.stroke(); }
    c2.restore();
  }

  /* ================= z0 天空 ================= */
  function drawSky(scene, camS) {
    var isOut = scene === 'morning_cool' || scene === 'school_road';
    var isIn = scene === 'noon_warm' || scene === 'school_road_in';
    var key = isIn ? 'sky_in' : (scene === 'lotus_pond' ? 'sky_day' : (isOut ? 'sky_out' : 'sky_day'));
    var g = grad(key, function () {
      var gr = c.createLinearGradient(0, 0, 0, viewH);
      if (key === 'sky_in') { gr.addColorStop(0, C.skyInA); gr.addColorStop(0.72, C.skyInB); }
      else if (key === 'sky_out') { gr.addColorStop(0, C.skyOutA); gr.addColorStop(0.72, C.skyOutB); }
      else { gr.addColorStop(0, C.skyOutA); gr.addColorStop(0.72, C.skyOutB); }
      return gr;
    });
    c.fillStyle = g;
    c.fillRect(0, 0, viewW, viewH);

    /* 云 */
    var n = isIn ? 5 : 3;
    for (var i = 0; i < n; i++) {
      var span = 1400;
      var cx = ((i * span - camS * 0.12) % (span * n) + span * n) % (span * n) - 100;
      drawCloud(cx, 80 + (i % 3) * 46, 1 + (i % 2) * 0.35);
    }
    /* 远处钟：去程上学钟 / 回程放学钟 */
    drawBell(760 - (camS * 0.08) % 1800, 150, isIn ? 'out' : 'in');
    /* 回程专属：热气球 + 蝴蝶（活泼归家） */
    if (isIn) {
      drawBalloon(200 - (camS * 0.1) % 1600 + 40, 170, 0.8);
      drawButterfly(520 - (camS * 0.18) % 1200 + 60, 300, Game.animT);
      drawButterfly(880 - (camS * 0.14) % 1500 + 90, 260, Game.animT * 1.3);
    }
    /* 暖黄叠层（回程色调偏移的第一层） */
    if (isIn) { c.fillStyle = K.C && 'rgba(255,180,90,.12)'; c.fillRect(0, 0, viewW, viewH); }
  }
  function drawCloud(x, y, s) {
    c.save(); c.globalAlpha = 0.85; c.fillStyle = '#fff';
    c.beginPath();
    c.arc(x, y, 20 * s, 0, Math.PI * 2);
    c.arc(x + 22 * s, y + 5 * s, 15 * s, 0, Math.PI * 2);
    c.arc(x - 20 * s, y + 6 * s, 14 * s, 0, Math.PI * 2);
    c.fill(); c.restore();
  }
  function drawBell(x, y, kind) {
    c.save(); c.translate(x, y);
    c.strokeStyle = 'rgba(74,55,34,.35)'; c.lineWidth = 3; c.fillStyle = kind === 'out' ? C.chick : C.beak;
    c.beginPath(); c.moveTo(0, 0); c.lineTo(0, -18); c.stroke();
    c.beginPath(); c.moveTo(-16, 16); c.quadraticCurveTo(-16, -12, 0, -12); c.quadraticCurveTo(16, -12, 16, 16); c.closePath();
    c.fill(); c.stroke();
    c.beginPath(); c.arc(0, 20, 4, 0, Math.PI * 2); c.fillStyle = C.ink; c.fill();
    c.restore();
  }
  function drawBalloon(x, y, s) {
    c.save(); c.translate(x, y + Math.sin(Game.animT * 0.8) * 6); c.scale(s, s);
    c.fillStyle = C.comb; c.strokeStyle = C.ink; c.lineWidth = 2;
    c.beginPath(); c.ellipse(0, 0, 20, 24, 0, 0, Math.PI * 2); c.fill(); c.stroke();
    c.beginPath(); c.moveTo(0, 24); c.lineTo(0, 40); c.stroke();
    c.restore();
  }
  function drawButterfly(x, y, t) {
    c.save(); c.translate(x, y);
    var f = Math.sin(t * 6) * 0.6;
    c.fillStyle = C.beak;
    c.save(); c.scale(1, 1 + f * 0.5); c.beginPath(); c.ellipse(-6, 0, 7, 5, 0, 0, Math.PI * 2); c.fill(); c.restore();
    c.save(); c.scale(1, 1 - f * 0.5); c.beginPath(); c.ellipse(6, 0, 7, 5, 0, 0, Math.PI * 2); c.fill(); c.restore();
    c.restore();
  }

  /* ================= z1 远景 / z2 中景（视差 0.25 / 0.55） ================= */
  function drawFar(kind, camS) {
    var y = 400;
    c.save(); c.globalAlpha = 0.55;
    c.fillStyle = '#CFE3B8';
    var off = (camS * 0.25) % 320;
    for (var x = -off - 320; x < viewW + 320; x += 320) {
      if (kind === 'fence') {
        c.fillStyle = '#D9BE8C'; c.fillRect(x, y, 260, 120);
        for (var i = 0; i < 5; i++) { c.fillStyle = '#C9A874'; c.fillRect(x + i * 52, y - 18, 12, 138); }
      } else if (kind === 'wheat') {
        c.fillStyle = '#EBD79A';
        c.beginPath(); c.ellipse(x + 100, y + 60, 190, 90, 0, 0, Math.PI * 2); c.fill();
      } else if (kind === 'reeds') {
        c.fillStyle = '#A8C8A0';
        for (var j = 0; j < 7; j++) { c.fillRect(x + j * 46, y - 30, 5, 150); }
      } else {
        c.fillStyle = '#CFE3B8';
        c.beginPath(); c.ellipse(x + 140, y + 70, 200, 100, 0, 0, Math.PI * 2); c.fill();
      }
    }
    c.restore();
  }
  function drawMid(kind, camS) {
    var gy = Game.seg ? Game.seg.groundY : 520;
    var off = (camS * 0.55) % 260;
    for (var x = -off - 260; x < viewW + 260; x += 260) {
      if (kind === 'trees') {
        c.save();
        c.fillStyle = '#7FB05E'; c.strokeStyle = C.ink; c.lineWidth = 3;
        c.beginPath(); c.arc(x + 90, gy - 90, 54, 0, Math.PI * 2); c.fill(); c.stroke();
        c.fillStyle = '#B08A5A'; c.fillRect(x + 84, gy - 50, 12, 50);
        c.restore();
      } else if (kind === 'wall') {
        c.fillStyle = '#E0D2B8'; c.fillRect(x, gy - 56, 200, 56);
        c.strokeStyle = 'rgba(74,55,34,.25)'; c.lineWidth = 2;
        for (var i = 0; i < 4; i++) { c.beginPath(); c.moveTo(x + i * 50, gy - 56); c.lineTo(x + i * 50, gy); c.stroke(); }
      }
    }
  }

  /* ================= z3 地面带（可无缝循环，图案宽为整数） ================= */
  var GROUND_W = 256;
  function drawGroundBand(kind, camS) {
    var gy = Game.seg ? Game.seg.groundY : 520;
    var body, top;
    if (kind === 'water') { body = '#8FC8E8'; top = '#A8DCEF'; }
    else if (kind === 'mud') { body = '#B89A72'; top = '#C9AE86'; }
    else if (kind === 'dirt') { body = '#D8BE90'; top = '#E8D2A8'; }
    else if (kind === 'roadIn') { body = '#E0C48E'; top = '#EFD8A6'; }
    else { body = '#D2B184'; top = '#E4C79C'; }
    c.fillStyle = body;
    c.fillRect(0, gy, viewW, viewH - gy);
    c.fillStyle = top;
    c.fillRect(0, gy, viewW, 12);
    /* 无缝循环图案：偏移取模，图案宽为整数 → 任意偏移无接缝 */
    var off = ((camS % GROUND_W) + GROUND_W) % GROUND_W;
    c.save(); c.globalAlpha = 0.5;
    if (kind === 'water') {
      c.strokeStyle = 'rgba(255,255,255,.55)'; c.lineWidth = 3;
      for (var i = -1; i < viewW / 64 + 1; i++) {
        var x = i * 64 - off;
        c.beginPath(); c.moveTo(x, gy + 40); c.quadraticCurveTo(x + 32, gy + 32, x + 64, gy + 40); c.stroke();
        c.beginPath(); c.moveTo(x + 20, gy + 96); c.quadraticCurveTo(x + 52, gy + 88, x + 84, gy + 96); c.stroke();
      }
    } else {
      c.fillStyle = 'rgba(74,55,34,.18)';
      for (var j = 0; j < 4; j++) {
        c.beginPath(); c.ellipse(j * GROUND_W - off + 60, gy + 46 + j * 26, 26, 8, 0, 0, Math.PI * 2); c.fill();
      }
      /* 落叶（去程秋意） */
      c.fillStyle = 'rgba(255,154,60,.55)';
      for (var m = 0; m < 5; m++) {
        var lx = m * (GROUND_W / 5) - off + 100;
        c.save(); c.translate(lx, gy + 22 + (m % 2) * 16); c.rotate(Game.animT * 0.4 + m);
        c.beginPath(); c.ellipse(0, 0, 9, 4, 0, 0, Math.PI * 2); c.fill(); c.restore();
      }
    }
    c.restore();
  }

  /* ================= z4 地面箭头带 ★ R2 最高优先级 ================= */
  /** dir：'right' | 'left'。箭头**全部朝同一个方向**。 */
  function drawArrowBand(arrowDir, camS) {
    if (!arrowDir || arrowDir === '-') return;
    var gy = (Game.seg ? Game.seg.groundY : 520) + 46;
    var sgn = arrowDir === 'right' ? 1 : -1;
    var spacing = 200;
    var off = ((camS % spacing) + spacing) % spacing;
    c.save();
    for (var i = -1; i * spacing - off < viewW + spacing; i++) {
      var x = i * spacing - off;
      c.save(); c.translate(x, gy + (i % 2 === 0 ? 0 : 30)); c.scale(sgn, 1);
      c.globalAlpha = 0.42;
      c.fillStyle = C.comb;
      c.beginPath();
      c.moveTo(24, 0); c.lineTo(2, -15); c.lineTo(2, -6); c.lineTo(-26, -6);
      c.lineTo(-26, 6); c.lineTo(2, 6); c.lineTo(2, 15);
      c.closePath(); c.fill();
      c.restore();
    }
    c.restore();
  }

  /* ================= z5 障碍 / 终点道具 ================= */
  function drawObstacles() {
    if (!Game.seg) return;
    var gy = Game.seg.groundY;
    for (var i = 0; i < Game.obstacles.length; i++) {
      var o = Game.obstacles[i];
      var x = sToX(o.s);
      if (x < -140 || x > viewW + 140) continue;
      c.save(); c.translate(x, gy);
      Art.drawObstacle(c, o, Game.animT);
      c.restore();
    }
    for (var j = 0; j < Game.movers.length; j++) {
      var m = Game.movers[j];
      var mx = sToX(m.s);
      if (mx < -140 || mx > viewW + 140) continue;
      c.save(); c.translate(mx, gy);
      Art.drawObstacle(c, { type: m.type, w: m.w, h: m.h, spin: m.spin }, Game.animT);
      c.restore();
    }
  }

  /** 终点道具：校门拱门 / 起点旗 */
  function drawGoalProps() {
    if (!Game.seg || !Game.level) return;
    var gy = Game.seg.groundY;
    var lv = Game.level;
    if (lv.roundTrip) {
      var inbound = Game.segName === 'inbound';
      /* 拱门在「当前段终点」；起点旗在「当前段起点」 */
      drawArch(sToX(Game.seg.segLen), gy, inbound);
      drawFlag(sToX(60), gy);
    } else {
      drawFlag(sToX(Game.seg.exitX - 40), gy);
    }
  }

  /** 校门拱门：书本 + 铅笔 + 铃铛图形，**不出现文字**；两态（终点 / 回程起点） */
  function drawArch(x, gy, isInbound) {
    c.save(); c.translate(x, gy);
    c.strokeStyle = C.ink; c.lineWidth = 4; c.fillStyle = isInbound ? C.beak : C.chick;
    c.beginPath(); c.moveTo(-90, 0); c.lineTo(-90, -150); c.quadraticCurveTo(0, -230, 90, -150); c.lineTo(90, 0);
    c.lineWidth = 10; c.strokeStyle = isInbound ? C.beak : C.chick; c.stroke();
    c.lineWidth = 4; c.strokeStyle = C.ink; c.stroke();
    /* 门柱 */
    c.fillStyle = '#E4C79C'; c.fillRect(-96, 0, 14, 0);
    /* 书本图形 */
    c.save(); c.translate(0, -168);
    c.fillStyle = '#fff'; c.beginPath();
    c.moveTo(-30, 8); c.lineTo(0, 0); c.lineTo(30, 8); c.lineTo(30, -18); c.lineTo(0, -26); c.lineTo(-30, -18);
    c.closePath(); c.fill(); c.stroke();
    c.beginPath(); c.moveTo(0, 0); c.lineTo(0, -26); c.stroke();
    c.restore();
    /* 铅笔 */
    c.save(); c.translate(38, -140); c.rotate(-0.5);
    c.fillStyle = C.beak; c.fillRect(-5, -34, 10, 40);
    c.fillStyle = C.ink; c.beginPath(); c.moveTo(-5, 6); c.lineTo(5, 6); c.lineTo(0, 16); c.closePath(); c.fill();
    c.restore();
    /* 铃铛 */
    c.save(); c.translate(-40, -140);
    c.fillStyle = C.chick; c.beginPath(); c.arc(0, 0, 13, Math.PI, 0); c.closePath(); c.fill(); c.stroke();
    c.beginPath(); c.arc(0, 5, 4, 0, Math.PI * 2); c.fillStyle = C.ink; c.fill();
    c.restore();
    c.restore();
  }

  /** 起点小旗 + 集合垫：表达「回到这里就赢了」 */
  function drawFlag(x, gy) {
    c.save(); c.translate(x, gy);
    c.strokeStyle = C.ink; c.lineWidth = 4;
    c.beginPath(); c.moveTo(0, 0); c.lineTo(0, -110); c.stroke();
    c.fillStyle = C.comb;
    c.beginPath(); c.moveTo(0, -110); c.lineTo(46, -94); c.lineTo(0, -78); c.closePath();
    c.fill(); c.stroke();
    /* 集合垫 */
    c.fillStyle = C.chick; c.globalAlpha = 0.75;
    c.beginPath(); c.ellipse(0, 0, 34, 9, 0, 0, Math.PI * 2); c.fill();
    c.restore();
  }

  /* ================= z6 角色（按 s 排序后绘制，靠后的先画） ================= */
  function drawCharacters(alpha) {
    if (!Game.duck || !Game.seg) return;
    var gy = Game.seg.groundY;
    var list = [];
    var i, m;

    /* 队伍（同学） */
    for (i = 0; i < Game.team.length; i++) {
      m = Game.team[i];
      var mx = sToX(m.s);
      if (mx < -120 || mx > viewW + 120) continue;
      var pose = Art.POSES[m.id] ? (Art.POSES[m.id].wave ? 'wave' : 'stand') : 'stand';
      if (Math.abs(Game.duck.vx) > 30 && Art.POSES[m.id] && Art.POSES[m.id].run) pose = 'run';
      list.push({ s: m.s, id: m.id, pose: pose, opt: { t: m.t, frame: 0, blink: (m.t % 3.4) > 3.3 } });
    }
    /* 剧情站位 actor（未相遇的也要画出来，孩子能看到同学在路边） */
    var acts = Game.seg.actors || [];
    for (i = 0; i < acts.length; i++) {
      var a = acts[i];
      if (hasTeamNow(a.id)) continue;
      var asx = sToX(a.s);
      if (asx < -120 || asx > viewW + 120) continue;
      var near = Math.abs(Game.duck.s - a.s) < 200;
      list.push({ s: a.s, id: a.id, pose: near ? a.action : (a.action === 'wave' ? 'wave' : a.action), opt: { t: Game.animT, frame: 0, blink: false } });
    }
    /* 小鸭最后画（主角永远在视觉最前） */
    var d = Game.duck;
    var ix = d.prevS + (d.s - d.prevS) * alpha;
    var iy = d.prevY + (d.y - d.prevY) * alpha;
    list.push({ s: 1e9, id: 'duck', duck: true, px: ix, py: iy });

    list.sort(function (a, b) { return a.s - b.s; });

    for (i = 0; i < list.length; i++) {
      var it = list[i];
      var x, y;
      if (it.duck) { x = sToX(it.px); y = it.py; }
      else { x = sToX(it.s); y = gy; }
      if (x < -140 || x > viewW + 140) continue;

      var st = it.duck ? duckState(it.px, it.py) : (it.pose || 'stand');
      var R = Art.resolve(it.id, st, it.opt || {});
      /* ★ 逐实体翻转：ctx.scale(dir * facing, 1)，并用 lineWidth 抵消缩放 */
      var flip = Game.dir;
      c.save();
      c.translate(x, y);
      c.scale(flip, 1);
      if (R.draw) R.draw(c, R.def, it.opt || { t: Game.animT });
      c.restore();
      if (it.duck) drawDuckFx(it.px, it.py, st);
    }
  }

  function hasTeamNow(id) {
    for (var i = 0; i < Game.team.length; i++) if (Game.team[i].id === id) return true;
    return false;
  }

  /** 小鸭碰撞演出形变（压扁 / 坐地 / 站起），三段严格按 hitT */
  function duckState(s, y) {
    var d = Game.duck;
    if (d.hitT > 0) {
      var el = K.HIT_TOTAL - d.hitT;
      if (el < K.HIT_STAGE1) return 'sitStars';
      if (el < K.HIT_STAGE2) return 'sitStars';
      return 'land';
    }
    return Game.animState();
  }

  function drawDuckFx(s, y, st) {
    var x = sToX(s);
    var d = Game.duck;
    c.save(); c.translate(x, y); c.scale(Game.dir, 1);
    if (d.hitT > 0) {
      var el = K.HIT_TOTAL - d.hitT;
      if (el < K.HIT_STAGE1) {            /* ① 压扁 */
        c.save(); c.scale(1.25, 0.7); c.beginPath(); c.arc(0, -20, 24, 0, Math.PI * 2);
        c.fillStyle = 'rgba(255,233,168,.85)'; c.fill(); c.restore();
      }
    }
    if (st === 'land' && d.landSquashT > 0) {
      var k = d.landSquashT / 0.18;
      c.globalAlpha = 0.28 * k;
      c.beginPath(); c.ellipse(0, 2, 34 * (1 + k * 0.3), 10, 0, 0, Math.PI * 2);
      c.fillStyle = C.ink; c.fill();
    }
    c.restore();
  }

  /* ================= z7 粒子 ================= */
  function drawParticles() { Art.drawParticles(c); }

  /* ================= z8 前景（视差 1.35） ================= */
  function drawFore(camS) {
    var gy = Game.seg ? Game.seg.groundY : 520;
    var off = (camS * 1.35) % 420;
    c.save(); c.globalAlpha = 0.3; c.fillStyle = '#6FA84E';
    for (var x = -off - 420; x < viewW + 420; x += 420) {
      c.beginPath();
      c.moveTo(x, viewH); c.lineTo(x + 40, gy + 96); c.lineTo(x + 90, viewH); c.closePath(); c.fill();
    }
    c.restore();
  }

  /* ================= z9 HUD（canvas 内）+ 气泡 ================= */
  function drawBubbles() {
    for (var i = 0; i < Game.bubbles.length; i++) {
      var b = Game.bubbles[i];
      if (b.t < 0) continue;
      var a = b.t < 0.2 ? b.t / 0.2 : (b.ttl - b.t < 0.3 ? (b.ttl - b.t) / 0.3 : 1);
      var who = b.who;
      var wx = who === 'duck' ? Game.duck.s : (findActorS(who) || Game.duck.s - 40);
      var x = sToX(wx);
      var y = (Game.seg ? Game.seg.groundY : 520) - 78;
      Art.drawBubble(c, x, y, b.text, { alpha: Math.max(0, a) });
    }
  }
  function findActorS(id) {
    var acts = Game.seg && Game.seg.actors ? Game.seg.actors : [];
    for (var i = 0; i < acts.length; i++) if (acts[i].id === id) return acts[i].s;
    return null;
  }

  function drawHUD() {
    clearHits();
    var pad = 14;
    var story = (Game.state === 'act1' || Game.state === 'act2');

    /* 幕一/幕二：⏩ 跳过（热区 52×52 ≥44px，全幕常驻）。
     * ⚠️ 必须在最前面无条件注册 —— 幕一没有 Game.seg，早期版本把这段放在
     *    「if (!seg) return」之后，导致跳过按钮根本没注册，点不动。 */
    if (Game.state === 'act1') {
      var ss = 52, sx = viewW - ss - pad, sy = pad;
      c.save();
      rr(sx, sy, ss, ss, K.R.md);
      c.fillStyle = 'rgba(255,255,255,.92)'; c.fill();
      c.lineWidth = 2.6; c.strokeStyle = C.ink; c.stroke();
      star(c, sx + ss / 2, sy + ss / 2, 12, C.chick, C.chickBr);
      c.fillStyle = C.ink;
      c.beginPath();
      c.moveTo(sx + 28, sy + 16); c.lineTo(sx + 40, sy + 26); c.lineTo(sx + 28, sy + 36);
      c.closePath(); c.fill();
      c.restore();
      hitRect('skip', sx, sy, ss, ss);
    }

    /* 幕三需要关卡数据：进度条 / 暂停 / 教学 / 辅助提示 */
    if (Game.state !== 'act3') return;
    var seg = Game.seg;
    if (!seg || !Game.duck) return;

    /* 进度条 */
    var bw = 200, bx = viewW - bw - pad, by = pad + 4;
    c.save();
    rr(bx, by, bw, 16, K.R.sm); c.fillStyle = 'rgba(255,255,255,.72)'; c.fill();
    c.lineWidth = 2; c.strokeStyle = 'rgba(74,55,34,.28)'; c.stroke();
    var pct = Math.max(0, Math.min(1, Game.duck.s / seg.segLen));
    rr(bx + 2, by + 2, Math.max(0, (bw - 4) * pct), 12, K.R.sm);
    c.fillStyle = Game.boostOn ? C.beak : C.chick; c.fill();
    c.restore();

    /* 第 5 关：双段标记（去程 / 回程） */
    if (Game.level && Game.level.roundTrip) {
      c.save();
      c.font = '600 14px ' + font; c.fillStyle = C.inkSoft; c.textAlign = 'right';
      var label = Game.subState === 'goBack' ? '回家 🏠' : '去学校 🏫';
      c.fillText(label, viewW - pad, by + 38);
      c.restore();
    }

    /* ❚❚ 暂停（热区 46×46 ≥44） */
    var ps = 46;
    var px = viewW - ps - pad, py = by + 46;
    c.save();
    rr(px, py, ps, ps, K.R.md);
    c.fillStyle = 'rgba(255,255,255,.9)'; c.fill();
    c.lineWidth = 2.4; c.strokeStyle = C.ink; c.stroke();
    c.fillStyle = C.ink;
    c.fillRect(px + 15, py + 13, 5, 20); c.fillRect(px + 26, py + 13, 5, 20);
    c.restore();
    hitRect('pause', px, py, ps, ps);

    /* 教学手指光点（第 1 关） */
    if (Game.tut.active) drawTutorialFinger();

    /* 辅助前进提示（无文字，靠图标） */
    if (Game.assistT > 0) {
      c.save(); c.globalAlpha = 0.9;
      c.fillStyle = C.chick;
      var ax = sToX(nextJumpS()) - 20;
      c.beginPath(); c.moveTo(ax, seg.groundY - 120); c.lineTo(ax + 14, seg.groundY - 100); c.lineTo(ax - 14, seg.groundY - 100);
      c.closePath(); c.fill();
      c.restore();
    }
    void story;
  }
  function nextJumpS() {
    var best = Game.seg.segLen;
    for (var i = 0; i < Game.obstacles.length; i++) {
      if (Game.obstacles[i].s > Game.duck.s + 8 && Game.obstacles[i].s < best) best = Game.obstacles[i].s;
    }
    return best;
  }

  /** 手指光点动画：holdDemo 按住态 / tapDemo 点击态（图标化，无文字） */
  function drawTutorialFinger() {
    var steps = Game.level.tutorial.steps;
    var st = steps[Game.tut.i];
    if (!st) return;
    var t = Game.tut.t / st.durMs;
    var x = st.kind === 'holdDemo' ? 300 : 420;
    var y = viewH * 0.72;
    c.save(); c.globalAlpha = 0.9;
    /* 手掌 */
    c.fillStyle = '#fff'; c.strokeStyle = C.ink; c.lineWidth = 3;
    c.beginPath(); c.ellipse(x, y, 20, 25, 0, 0, Math.PI * 2); c.fill(); c.stroke();
    c.beginPath(); c.ellipse(x, y - 28, 11, 14, 0, 0, Math.PI * 2); c.fill(); c.stroke();
    if (st.kind === 'holdDemo') {
      c.fillStyle = C.beak;
      c.beginPath(); c.arc(x + 40, y - 6, 12 + Math.sin(t * 12) * 3, 0, Math.PI * 2); c.fill();
      c.stroke();
    } else {
      var times = st.times || 2;
      var ph = (t * times) % 1;
      var sc = 1 - Math.max(0, 1 - ph * 4) * 0.5;
      c.save(); c.translate(x, y - 62); c.scale(sc, sc);
      c.beginPath(); c.arc(0, 0, 13, 0, Math.PI * 2);
      c.fillStyle = 'rgba(228,69,58,.6)'; c.fill(); c.strokeStyle = C.ink; c.lineWidth = 2.4; c.stroke();
      c.restore();
    }
    c.restore();
  }

  /* ================= 剧情幕绘制（幕一 / 幕二） ================= */
  function drawStory() {
    if (Game.state === 'act1') drawAct1();
    else if (Game.state === 'act2') drawAct2();
    else if (Game.state === 'finale') drawFinale();
  }

  /** 幕一 · 小鸭卧室（夜）：床 + 被子 + 闹钟 + 窗；结尾金光扫过 */
  function drawAct1() {
    var g = grad('room_night', function () {
      var gr = c.createLinearGradient(0, 0, 0, viewH);
      gr.addColorStop(0, '#D8D2C0'); gr.addColorStop(1, '#EFE0C0');
      return gr;
    });
    c.fillStyle = g; c.fillRect(0, 0, viewW, viewH);
    /* 墙 */
    c.fillStyle = 'rgba(255,251,236,.6)'; c.fillRect(0, 0, viewW, viewH * 0.62);
    /* 窗 + 月亮（结尾变金色） */
    var dawn = St.dawnPhase();
    c.save();
    c.translate(viewW - 170, 110);
    c.fillStyle = dawn > 0 ? mix('#3A4A6A', '#FFD98A', dawn) : '#3A4A6A';
    rr(-70, -50, 140, 100, K.R.md); c.fill();
    c.strokeStyle = C.ink; c.lineWidth = 4; c.stroke();
    if (dawn <= 0) { c.fillStyle = '#FFF3D0'; c.beginPath(); c.arc(30, -16, 20, 0, Math.PI * 2); c.fill(); }
    c.restore();
    /* 床 */
    var bedY = viewH - 170;
    c.fillStyle = '#C9A874'; c.fillRect(120, bedY, 620, 130);
    c.fillStyle = '#B08A5A'; c.fillRect(120, bedY, 620, 16);
    c.strokeStyle = C.ink; c.lineWidth = 4; c.strokeRect(120, bedY, 620, 130);
    /* 枕头 */
    c.fillStyle = '#FFF6E0'; rr(150, bedY - 34, 120, 46, K.R.sm); c.fill(); c.stroke();
    /* 被子：随呼吸起伏 */
    var br = St.t() ? Math.sin(St.t() / K.BREATH_PERIOD * Math.PI * 2) * 5 : 0;
    c.save();
    c.fillStyle = C.chick;
    rr(280, bedY - 34 - br, 440, 60 + br, K.R.md); c.fill();
    c.strokeStyle = C.ink; c.lineWidth = 4; c.stroke();
    c.restore();
    /* 小鸭侧躺 */
    c.save(); c.translate(250, bedY - 44 - br);
    var st = St.t() < 3 || St.skipping() ? 'sleep' : 'snore';
    var bub = (St.t() > 3 && St.t() < 17) ? ((St.t() * 0.6) % 1) : 0;
    var R = Art.resolve('duck', st, { t: St.t(), bubble: bub });
    c.scale(Game.dir, 1);
    R.draw(c, R.def, { t: St.t(), bubble: bub });
    c.restore();
    /* 床头闹钟 */
    c.save(); c.translate(700, bedY - 60);
    c.fillStyle = C.comb; c.beginPath(); c.arc(0, 0, 26, 0, Math.PI * 2); c.fill();
    c.strokeStyle = C.ink; c.lineWidth = 3.5; c.stroke();
    c.fillStyle = '#fff'; c.beginPath(); c.arc(0, 0, 19, 0, Math.PI * 2); c.fill();
    c.strokeStyle = C.ink; c.lineWidth = 2.6;
    c.beginPath(); c.moveTo(0, 0); c.lineTo(0, -13); c.moveTo(0, 0); c.lineTo(10, 4); c.stroke();
    c.restore();
    /* 静默光晕（视觉替代音效表达「安静」） */
    var pr = St.progress();
    if (pr > 0.68) {
      var k = Math.min(1, (pr - 0.68) / 0.32);
      c.save(); c.globalAlpha = 0.4 * k;
      var rg = c.createRadialGradient(viewW / 2, viewH * 0.5, 20, viewW / 2, viewH * 0.5, 320);
      rg.addColorStop(0, 'rgba(255,240,190,.95)'); rg.addColorStop(1, 'rgba(255,240,190,0)');
      c.fillStyle = rg; c.fillRect(0, 0, viewW, viewH);
      c.restore();
    }
    /* 金光左→右扫过 */
    if (dawn > 0) {
      c.save(); c.globalAlpha = 0.55 * (1 - dawn * 0.4);
      var sx = dawn * (viewW + 360) - 180;
      var lg = c.createLinearGradient(sx - 180, 0, sx + 180, 0);
      lg.addColorStop(0, 'rgba(255,217,138,0)'); lg.addColorStop(0.5, 'rgba(255,240,190,.9)'); lg.addColorStop(1, 'rgba(255,217,138,0)');
      c.fillStyle = lg; c.fillRect(0, 0, viewW, viewH);
      c.restore();
    }
    if (St.waiting()) drawStoryHint('👆');
  }

  /** 幕二 · 卧室晨 / 卫生间：6 段逐段点击；厕所段只有影子 + 圆圈，无任何排泄物 */
  function drawAct2() {
    var step = St.currentStep();
    var t = St.t();
    if (!step) return;
    var g = grad('room_morning', function () {
      var gr = c.createLinearGradient(0, 0, 0, viewH);
      gr.addColorStop(0, '#FFE9B8'); gr.addColorStop(1, '#FFF6E0');
      return gr;
    });
    c.fillStyle = g; c.fillRect(0, 0, viewW, viewH);
    var floorY = viewH - 120;

    if (step.pose === 'toilet') {
      /* —— M2-3 卫生间：门 + 影子 + 圆圈，完全抽象化 —— */
      c.save();
      c.fillStyle = '#EAD3A8'; c.fillRect(0, floorY - 20, viewW, 20);
      /* 洗手台 */
      c.fillStyle = '#fff'; rr(80, floorY - 110, 200, 100, K.R.md); c.fill();
      c.strokeStyle = C.ink; c.lineWidth = 4; c.stroke();
      c.fillStyle = '#B8D8E8'; c.beginPath(); c.ellipse(180, floorY - 110, 60, 12, 0, 0, Math.PI * 2); c.fill();
      /* 门 */
      c.fillStyle = '#D8B888'; rr(360, floorY - 300, 220, 300, K.R.md); c.fill(); c.stroke();
      c.beginPath(); c.arc(556, floorY - 150, 8, 0, Math.PI * 2); c.fillStyle = C.ink; c.fill();
      /* 门后影子：只有轮廓，故意看不出在做什么 */
      var sh = Math.sin(t * 3.4) * 8;
      c.save(); c.globalAlpha = 0.55; c.fillStyle = '#8A7250';
      c.beginPath(); c.ellipse(470 + sh, floorY - 120, 30, 76, 0, 0, Math.PI * 2); c.fill();
      c.beginPath(); c.arc(470 + sh, floorY - 206, 22, 0, Math.PI * 2); c.fill();
      c.restore();
      /* 头顶小圆圈（抽象「使劲」） */
      for (var i = 0; i < 3; i++) {
        var ph = ((t * 0.6 + i / 3) % 1);
        c.save(); c.globalAlpha = 1 - ph;
        c.beginPath(); c.arc(470 + sh, floorY - 240 - ph * 40, 6 + ph * 8, 0, Math.PI * 2);
        c.fillStyle = '#fff'; c.strokeStyle = C.ink; c.lineWidth = 2.4; c.fill(); c.stroke();
        c.restore();
      }
      c.restore();
      /* 无台词 */
    } else {
      /* —— 卧室晨 —— */
      c.fillStyle = 'rgba(255,246,224,.8)'; c.fillRect(0, 0, viewW, floorY);
      c.fillStyle = '#E0C48E'; c.fillRect(0, floorY, viewW, viewH - floorY);
      /* 窗 + 金光 */
      c.save(); c.translate(viewW - 190, 120);
      c.fillStyle = '#FFE9B8'; rr(-80, -60, 160, 120, K.R.md); c.fill();
      c.strokeStyle = C.ink; c.lineWidth = 4; c.stroke();
      c.restore();
      /* 床 */
      var bedY = floorY - 90;
      c.fillStyle = '#C9A874'; c.fillRect(110, bedY, 340, 100);
      c.strokeStyle = C.ink; c.lineWidth = 4; c.strokeRect(110, bedY, 340, 100);
      c.fillStyle = '#FFF6E0'; rr(130, bedY - 28, 100, 38, K.R.sm); c.fill(); c.stroke();
      /* 洗手台（洗手/擦手段） */
      if (step.pose === 'wash' || step.pose === 'wipe') {
        c.fillStyle = '#fff'; rr(600, floorY - 120, 220, 110, K.R.md); c.fill();
        c.strokeStyle = C.ink; c.lineWidth = 4; c.stroke();
        c.fillStyle = '#B8D8E8'; c.beginPath(); c.ellipse(710, floorY - 118, 68, 12, 0, 0, Math.PI * 2); c.fill();
        c.strokeStyle = C.ink; c.lineWidth = 3;
        c.beginPath(); c.moveTo(710, floorY - 118); c.lineTo(710, floorY - 150); c.stroke();
        /* 镜子 */
        c.fillStyle = '#E4F0F6'; rr(660, floorY - 280, 120, 120, K.R.md); c.fill(); c.stroke();
      }
      /* 垃圾桶（擦手段） */
      if (step.pose === 'wipe') {
        c.fillStyle = '#B8C8D0'; c.fillRect(870, floorY - 70, 54, 70);
        c.strokeStyle = C.ink; c.lineWidth = 3.4; c.strokeRect(870, floorY - 70, 54, 70);
      }
      /* 小鸭 */
      var pose = step.pose;
      var pose2 = (step.pose === 'stretch' && (t % 8) < 4) ? 'rubEye' : pose;
      c.save(); c.translate(470, floorY);
      var R = Art.resolve('duck', pose2, { t: St.t() });
      c.scale(Game.dir, 1);
      R.draw(c, R.def, { t: St.t() });
      c.restore();
      /* 气泡 */
      if (step.line) {
        c.save();
        c.globalAlpha = Math.min(1, St.stepT() * 2);
        Art.drawBubble(c, 470, floorY - 96, step.line, {});
        c.restore();
      }
      /* 四枚勾：左上角依次点亮 */
      drawHygieneChecks();
    }
    drawStoryHint('👆');
  }

  /** 四枚勾（想上厕所 / 上厕所 / 洗手 / 擦干净），全亮撒彩带 */
  function drawHygieneChecks() {
    var h = global.Save.data.hygiene;
    var items = [['potty', '🚽'], ['wipe', '🚿'], ['wash', '🧼'], ['bag', '🎒']];
    c.save();
    for (var i = 0; i < items.length; i++) {
      var x = 40 + i * 66, y = 34;
      c.globalAlpha = h[items[i][0]] ? 1 : 0.28;
      c.fillStyle = '#fff'; rr(x, y, 52, 52, K.R.md); c.fill();
      c.strokeStyle = C.ink; c.lineWidth = 3; c.stroke();
      c.font = '24px ' + font; c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillText(items[i][1], x + 26, y + 26);
      if (h[items[i][0]]) {
        c.strokeStyle = C.beak; c.lineWidth = 4;
        c.beginPath(); c.moveTo(x + 34, y + 12); c.lineTo(x + 41, y + 22); c.lineTo(x + 51, y + 6); c.stroke();
      }
    }
    c.restore();
  }

  function drawStoryHint(icon) {
    c.save();
    c.globalAlpha = 0.55 + Math.sin(Game.animT * 4) * 0.2;
    c.fillStyle = C.comb;
    c.beginPath(); c.arc(viewW / 2, viewH - 44, 22, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#fff';
    c.font = '24px ' + font; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText(icon, viewW / 2, viewH - 42);
    c.restore();
  }

  /** 结局：8 位同学列队和小鸭一起走进家门 + 大礼花 */
  function drawFinale() {
    var t = Game.finaleT;
    var g = grad('finale_sky', function () {
      var gr = c.createLinearGradient(0, 0, 0, viewH);
      gr.addColorStop(0, C.skyInA); gr.addColorStop(1, C.skyInB);
      return gr;
    });
    c.fillStyle = g; c.fillRect(0, 0, viewW, viewH);
    var gy = viewH - 130;
    c.fillStyle = '#E0C48E'; c.fillRect(0, gy, viewW, viewH - gy);
    /* 家门 */
    var hx = viewW - 250;
    c.fillStyle = '#FFF6E0'; rr(hx, gy - 220, 200, 220, K.R.md); c.fill();
    c.strokeStyle = C.ink; c.lineWidth = 4; c.stroke();
    c.fillStyle = C.comb;
    c.beginPath(); c.moveTo(hx - 18, gy - 218); c.lineTo(hx + 100, gy - 300); c.lineTo(hx + 218, gy - 218); c.closePath();
    c.fill(); c.stroke();
    c.fillStyle = '#8A5A3A'; rr(hx + 70, gy - 120, 62, 120, K.R.sm); c.fill(); c.stroke();
    /* 队伍：8 位 + 小鸭，走向家门 */
    var walk = Math.min(1, t / 3.4);
    var n = K.LINEUP.length;
    for (var i = n - 1; i >= 0; i--) {
      var id = K.LINEUP[i];
      var x = 90 + i * 46 + walk * (hx - 300);
      c.save(); c.translate(x, gy);
      c.scale(Game.dir, 1);
      var st = Math.abs(Math.sin(t * 6 + i)) > 0.5 ? 'run' : 'stand';
      var R = Art.resolve(id, st, { t: t + i, frame: Math.floor(t * 6 + i) % 2 });
      if (R.draw) R.draw(c, R.def, { t: t + i, frame: Math.floor(t * 6 + i) % 2 });
      c.restore();
    }
    /* 小鸭挽手走（主角最后/最前） */
    c.save(); c.translate(40 + walk * (hx - 260), gy);
    c.scale(Game.dir, 1);
    var Rd = Art.resolve('duck', Math.abs(Math.sin(t * 6)) > 0.5 ? 'walkArm' : 'walkArm', { t: t, frame: Math.floor(t * 6) % 2, partner: 'right' });
    if (Rd.draw) Rd.draw(c, Rd.def, { t: t, frame: Math.floor(t * 6) % 2, partner: 'right' });
    c.restore();
    /* 全员气泡 */
    if (t < 2.2) Art.drawBubble(c, hx + 100, gy - 340, '回家咯——！', { alpha: 1 - t / 2.2 });
    Art.drawParticles(c);
  }

  /* ================= 一帧 ================= */
  function frame(alpha) {
    if (!c) return;
    Game.advanceBob(Render._dt || 0);
    var camS = Game.camS;

    if (Game.state === 'paused') { drawWorldFrame(alpha, camS); return; }
    if (Game.state === 'act1' || Game.state === 'act2' || Game.state === 'finale') {
      drawStory();
      drawHUD();
      return;
    }
    if (Game.state === 'title' || Game.state === 'boot') { drawTitleBackdrop(); return; }
    drawWorldFrame(alpha, camS);
  }

  function drawTitleBackdrop() {
    var g = grad('title_bg', function () {
      var gr = c.createLinearGradient(0, 0, 0, viewH);
      gr.addColorStop(0, C.skyOutA); gr.addColorStop(1, C.skyOutB);
      return gr;
    });
    c.fillStyle = g; c.fillRect(0, 0, viewW, viewH);
    var gy = viewH - 120;
    c.fillStyle = '#D2B184'; c.fillRect(0, gy, viewW, viewH - gy);
    c.save(); c.translate(viewW * 0.72, gy);
    c.scale(1, 1);
    var R = Art.resolve('duck', 'wave', { t: Game.animT });
    if (R.draw) R.draw(c, R.def, { t: Game.animT });
    c.restore();
    Art.drawParticles(c);
  }

  function drawWorldFrame(alpha, camS) {
    var seg = Game.seg;
    if (!seg) { drawTitleBackdrop(); return; }
    var scene = Art.SCENES[seg.scene] || Art.SCENES.village_start;

    drawSky(seg.sky, camS);
    drawFar(scene.far, camS);
    drawMid(scene.mid, camS);
    drawGroundBand(seg.terrain && seg.terrain[0] ? seg.terrain[0].kind : 'road', camS);
    /* ★ z4 箭头带：回程全部朝左 */
    drawArrowBand(seg.arrows, camS);
    drawObstacles();
    drawGoalProps();
    drawCharacters(alpha);
    drawParticles();
    drawFore(camS);
    drawBubbles();
    drawHUD();

    /* 中途事件遮罩文字（正向鼓励，不做失败暗示） */
    if (Game.subState === 'midEvent') drawMidOverlay();
  }

  function drawMidOverlay() {
    var k = Math.min(1, Game.l5.midT / 0.4);
    c.save(); c.globalAlpha = 0.9 * k;
    c.fillStyle = 'rgba(255,251,236,.86)';
    rr(viewW / 2 - 200, 44, 400, 60, K.R.md); c.fill();
    c.strokeStyle = C.beak; c.lineWidth = 4; c.stroke();
    c.fillStyle = C.ink; c.font = '700 26px ' + font; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText('出发！一起回家！', viewW / 2, 74);
    c.restore();
  }

  global.Render = {
    init: function (canvas) { cv = canvas; c = cv.getContext('2d'); },
    ctx: function () { return c; },
    frame: frame,
    grad: grad,
    gradCount: gradCount,
    clearGradCache: clearGradCache,
    worldToScreenX: worldToScreenX,
    sToX: sToX,
    xToS: xToS,
    hitRect: hitRect,
    hitTest: hitTest,
    clearHits: clearHits,
    setView: setView,
    viewW: viewWNow,
    viewH: function () { return viewH; },
    _dt: 0,
    drawStory: drawStory
  };
})(window);


/* ==== src/js/80-ui.js ==== */
/* ===== src/js/80-ui.js · DOM 覆盖层：标题/关卡/设置/暂停/结算/图鉴/引导 · 依赖 00/05/10/60 =====
 * ⚠️ 面板隐藏 = display:none（完全不响应 pointer-events），避免「隐藏了还吃点击」。
 * ⚠️ 所有按钮 min-height ≥44px（硬约束 #4）。
 */
(function (global) {
  'use strict';

  var K = global.DUCK;
  var S = global.Save;
  var A = global.Audio;
  var G = global.Game;
  var L = global.Levels;

  function $(id) { return document.getElementById(id); }
  var screens = {
    title: 'screen-title', levels: 'screen-levels', l5ask: 'screen-l5ask',
    gallery: 'screen-gallery', settings: 'screen-settings',
    pause: 'screen-pause', result: 'screen-result', rot: 'screen-rot'
  };
  var current = 'title';

  function show(name) {
    for (var k in screens) {
      if (!Object.prototype.hasOwnProperty.call(screens, k)) continue;
      var el = $(screens[k]);
      if (el) el.classList.toggle('show', k === name);
    }
    current = name || '';
    if (name) A.play('ui_tap');
  }
  function hideAll() {
    for (var k in screens) {
      if (!Object.prototype.hasOwnProperty.call(screens, k)) continue;
      var el = $(screens[k]);
      if (el) el.classList.remove('show');
    }
    current = '';
  }

  /* ================= 标题 ================= */
  function showTitle() {
    renderGalleryQuick();
    show('title');
  }

  /* ================= 关卡选择 ================= */
  function showLevels() {
    var grid = $('level-grid');
    grid.innerHTML = '';
    var unlocked = S.data.progress.unlocked;
    for (var i = 0; i < L.count; i++) {
      (function (i) {
        var lv = L.get(i);
        var id = i + 1;
        var locked = id > unlocked;
        var cell = document.createElement('div');
        cell.className = 'level-cell' + (locked ? ' locked' : '') + (lv.roundTrip ? ' round' : '');
        var stars = S.data.progress.cleared[String(id)];
        var st = stars ? stars.stars : 0;
        var stTxt = '';
        for (var k = 0; k < 3; k++) stTxt += '<span class="' + (k < st ? '' : 'off') + '">★</span>';
        cell.innerHTML =
          '<div class="lv-no">' + (locked ? '🔒' : id) + '</div>' +
          '<div class="lv-name">' + lv.name + '</div>' +
          '<div class="lv-stars">' + (locked ? '' : stTxt) + '</div>' +
          (S.data.progress.l5Checkpoint && id === 5 ? '<div class="lv-ck">可续</div>' : '');
        if (!locked) {
          cell.addEventListener('click', function () { onPickLevel(i); });
        }
        grid.appendChild(cell);
      })(i);
    }
    show('levels');
  }

  /** 第 5 关有 inbound checkpoint → 询问式复用，默认高亮「从头跑」（R1 / PRD §10.4） */
  function onPickLevel(i) {
    var id = i + 1;
    var ck = S.data.progress.l5Checkpoint;
    if (id === 5 && ck && ck.phase === 'inbound') {

/* ===== src/js/90-main.js · 入口：DPR / 主循环 / 输入 / 键盘 / visibilitychange / __duck 钩子 =====
 * ⚠️ 全项目**唯一一处** requestAnimationFrame 续帧。多处 rAF 会导致帧率翻倍。
 * ⚠️ getBoundingClientRect 只在 fit() 之后测一次，绝不在 pointermove / rAF 里调。
 * ⚠️ canvas.width 改尺寸会重置 transform，改完必须 ctx.setTransform。

(function (global) {

  var K = global.DUCK;

  var St = global.Story;

  var cv = document.getElementById('cv');
  var app = document.getElementById('app');
  var stage = document.getElementById('stage');
  var ctx = cv.getContext('2d');

  var PORTRAIT = window.innerHeight > window.innerWidth;
  var DESIGN_W = K.DESIGN_W;
  var DESIGN_H = PORTRAIT ? K.DESIGN_H_PORTRAIT : K.DESIGN_H;
  var cvRect = { left: 0, top: 0, width: DESIGN_W, height: DESIGN_H };

  function applyDpr(s) {

    var bh = Math.max(1, Math.round(DESIGN_H * s * dpr));

    if (cv.width !== bw || cv.height !== bh) {
      cv.width = bw; cv.height = bh;

    ctx.setTransform(bw / DESIGN_W, 0, 0, bh / DESIGN_H, 0, 0);

  function measure() {

  }

    var w = window.innerWidth, h = window.innerHeight;
    var s = Math.min(w / DESIGN_W, h / DESIGN_H);

    if (Math.abs(s - lastFit) > 0.002 || lastFit < 0) {

      var y = (h - DESIGN_H * s) / 2;

      applyDpr(s);

      try {
        if (G.level && G.level.roundTrip && (G.subState === 'goBack' || G.subState === 'midEvent')) {
          S.checkpoint({ phase: G.subState === 'goBack' ? 'inbound' : 'mid', segTimeMs: G.segTimeMs, bumps: G.bumps, met: G.met.slice() });
        }
      } catch (e) {}
    } else {
      last = 0;                       /* 重取时间基准，回来不补一大段物理帧 */
      acc = 0;
      A.resumeClock();
      startLoop();
    }
  }

  /* ================= 测试钩子 window.__duck（26 个契约方法 + QA 辅助，同步返回，绝不抛） ================= */
  function nowMs() { return (global.performance && performance.now) ? performance.now() : Date.now(); }

  /** 面朝方向：vx 决定；静止时沿用 lastFace（停下不该突然转身） */
  function facing() {
    try {
      var d = G.duck;
      if (!d) return 1;
      if (Math.abs(d.vx) > 5) return d.vx > 0 ? 1 : -1;
      return d.lastFace || 1;
    } catch (e) { return 1; }
  }

  var duck = {
    ready: true,
    version: K.VERSION,

    state: function () { try { return G.state; } catch (e) { return null; } },

    subState: function () { try { return (G.level && G.level.roundTrip) ? G.subState : '-'; } catch (e) { return '-'; } },

    level: function () { try { return G.level ? G.level.id : 0; } catch (e) { return 0; } },

    duck: function () {
      try {
        var d = G.duck;
        if (!d) return null;
        return {
          s: d.s, x: R.sToX(d.s), y: d.y, vy: d.vy, vx: d.vx,
          grounded: d.grounded, facing: facing(), dir: G.dir, pose: G.animState()
        };
      } catch (e) { return null; }
    },
    cam: function () { try { return { s: G.camS }; } catch (e) { return null; } },
    progress: function () {
      try {
        var seg = G.seg;
        if (!seg) return null;
        return { segLen: seg.segLen, s: G.duck.s, pct: Math.max(0, Math.min(1, G.duck.s / seg.segLen)) };
      } catch (e) { return null; }
    },
    obstacles: function () {
      try {
        var out = [];
        for (var i = 0; i < G.obstacles.length; i++) {
          var o = G.obstacles[i];
          var x = R.sToX(o.s);
          if (x > -200 && x < R.viewW() + 200) out.push({ s: o.s, type: o.type, w: o.w, h: o.h, solid: o.solid });
        }
        return out;
      } catch (e) { return null; }
    },
    team: function () {
      try {
        var t = [];
        for (var i = 0; i < G.team.length; i++) t.push({ id: G.team[i].id, s: G.team[i].s || 0 });
        return t;
      } catch (e) { return null; }
    },
    met: function () { try { return G.met.slice(); } catch (e) { return []; } },
    stats: function () {
      try {
        return {
          bumps: G.bumps, segTimeMs: Math.round(G.segTimeMs), totalTimeMs: Math.round(G.totalTimeMs),
          assistCount: G.assistCount, stuckCount: S.data.stats.stuckCount, level: G.level ? G.level.id : 0
        };
      } catch (e) { return null; }
    },
    save: function () { try { return S.data; } catch (e) { return null; } },
    saveRaw: function () { try { return S.saveRaw(); } catch (e) { return null; } },
    resetSave: function () { try { S.reset(); return true; } catch (e) { return false; } },
    corruptSave: function (kind) { try { return S.corruptSave(kind); } catch (e) { return false; } },

    /** 触发一次跳跃（可选蓄力 ms）。走完整物理路径，可被 __duck.duck() 采样验证 */
    jump: function (holdMsValue) {
      try {
        if (!G.duck) return false;
        G.setInput({ tapEdge: true, holding: false, holdMs: holdMsValue || 0 });
        return true;
      } catch (e) { return false; }
    },
    hold: function (on) { try { G.setInput({ holding: !!on }); return true; } catch (e) { return false; } },
    /** 模拟一次完整点击（走 pointer 事件链） */
    tap: function () {
      try {
        var r = cv.getBoundingClientRect();
        var cx = r.left + r.width * 0.5, cy = r.top + r.height * 0.75;
        var opts = { pointerId: 1, bubbles: true, cancelable: true, clientX: cx, clientY: cy, isPrimary: true, pointerType: 'touch' };
        cv.dispatchEvent(new PointerEvent('pointerdown', opts));
        setTimeout(function () { cv.dispatchEvent(new PointerEvent('pointerup', opts)); }, 40);
        return true;
      } catch (e) { return false; }
    },

    goto: function (where) {
      try {
        switch (where) {
          case 'title': UI.hideAll(); G.goto('title'); UI.showTitle(); break;
          case 'act1': UI.hideAll(); G.goto('act1'); St.beginAct1(); break;
          case 'act2': UI.hideAll(); G.goto('act2'); St.play('act2'); break;
          case 'level1': case 'level2': case 'level3': case 'level4': case 'level5':
            UI.hideAll(); UI.startLevel(parseInt(where.slice(5), 10) - 1); break;
          case 'finale': G.goto('finale'); G.finaleT = 0; break;
          default: return false;
        }
        return true;
      } catch (e) { return false; }
    },

    skipAct1: function () { try { St.skipAct1(); return true; } catch (e) { return false; } },
    snoreGain: function () { try { return A.snoreGain(); } catch (e) { return 0; } },
    l5checkpoint: function (write) {
      try {
        if (write === undefined) return S.data.progress.l5Checkpoint;
        return S.checkpoint(write);
      } catch (e) { return null; }
    },

    loopInfo: function () {
      try {
        return { running: running, fps: fpsWin.fps, stepsLastFrame: stepsLastFrame, accMs: accMs };
      } catch (e) { return null; }
    },
    gradCount: function () { try { return R.gradCount(); } catch (e) { return 0; } },
    hitTest: function (x, y) { try { return R.hitTest(x, y); } catch (e) { return null; } },
    /** ★ A7b ③：回程箭头方向断言 */
    arrowDir: function () {
      try {
        if (!G.seg || !G.seg.arrows) return '-';
        return G.seg.arrows;
      } catch (e) { return '-'; }
    },

    /* —— 以下为便于 QA 的额外只读钩子（不改 26 个契约方法语义）—— */
    segName: function () { try { return G.segName || '-'; } catch (e) { return '-'; } },
    segLen: function () { try { return G.seg ? G.seg.segLen : 0; } catch (e) { return 0; } },
    cruise: function () { try { return G.seg ? G.seg.cruise : 0; } catch (e) { return 0; } },
    particles: function () { try { return global.Art.particles.length; } catch (e) { return 0; } },
    /** 当前段的完整定义（QA 用来核对障碍数 / 间距 / safeTail，不需要逐个翻视口） */
    segData: function () {
      try {
        var lv = G.level;
        if (!lv || !G.segName) return null;
        var s = lv[G.segName];
        return { name: G.segName, segLen: s.segLen, cruise: s.cruise, arrows: s.arrows, dir: s.dir, safeTail: s.safeTail, boost: s.boost, obstacles: s.obstacles.map(function (o) { return { s: o.s, type: o.type }; }) };
      } catch (e) { return null; }
    },
    /** 幕一渐弱进度 0..1（验收 A2b ③：跳过也必须走满 ≥3.2s） */
    fadeProgress: function () { try { return St.fadeProgress(); } catch (e) { return 0; } },
    posesCount: function () {
      try {
        var n = 0;
        for (var id in global.Art.POSES) { if (Object.prototype.hasOwnProperty.call(global.Art.POSES, id)) n += Object.keys(global.Art.POSES[id]).length; }
        return n;
      } catch (e) { return 0; }
    },
    /* 快进：把当前段直接推到终点附近（仅 QA 冒烟用，不属于游戏逻辑） */
    warpTo: function (s) {
      try {
        if (!G.duck || !G.seg) return false;
        G.duck.s = Math.max(0, Math.min(G.seg.segLen, s));
        G.duck.prevS = G.duck.s;
        /* 同步卡关锚点，否则 warp 后 maxS 仍是旧值，会被误判成「6 秒没进展」而触发辅助 */
        G.maxS = G.duck.s; G.stuckAnchorS = G.duck.s; G.stuckT = 0;
        G.camS = Math.max(0, Math.min(G.seg.segLen, G.duck.s - R.viewW() * 0.38));
        return true;
      } catch (e) { return false; }
    },
    /** 手动推进 n 个物理步（不依赖 rAF，QA 可做确定性物理断言） */
    stepFrames: function (n, dt) {
      try {
        var d = dt || K.FIXED_DT;
        for (var i = 0; i < (n || 1); i++) { G.step(d); A.advance(d); }
        return true;
      } catch (e) { return false; }
    },
    /** 幂等地把循环恢复（暂停恢复用；UI 不再直接依赖 __main 内部对象） */
    resumeLoop: function () {
      try { last = 0; acc = 0; startLoop(); return true; } catch (e) { return false; }
    },
    /** 段起点地面高度（QA 计算跳跃峰高：groundY - duck().y） */
    groundY: function () { try { return G.seg ? G.seg.groundY : 0; } catch (e) { return 0; } }
  };

  global.__duck = duck;

  /* ================= 启动 ================= */
  function boot() {
    try {
      S.load();
    } catch (e) {
      /* 兜底再兜底：无存档最小启动路径，只是不保存 */
      try { S.data = S.defaultSave(); } catch (e2) {}
    }
    A.init();
    A.setMusicEnabled(S.data.settings.music !== false);
    A.setSfxEnabled(S.data.settings.sfx !== false);

    R.init(cv);
    document.body.classList.toggle('portrait', PORTRAIT);
    fit();
    if (window.ResizeObserver) new ResizeObserver(scheduleFit).observe(document.documentElement);
    window.addEventListener('resize', scheduleFit);
    window.addEventListener('orientationchange', function () { setTimeout(onResize, 200); });
    document.addEventListener('visibilitychange', onVisibility);

    bindPointer();
    bindKeys();
    UI.init();

    /* 标题页：加载第 1 关数据供背景绘制，但状态停在 title */
    G.level = L.get(0);
    G.levelIndex = 0;
    G.goto('title');
    UI.showTitle();
    if (PORTRAIT && !S.data.settings.rotTipShown) UI.maybeShowRotTip();

    startLoop();
    duck.ready = true;
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})(window);

</script></body>
</html>
